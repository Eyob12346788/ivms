<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>የተረጋገጠ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@500;600;700;800&family=Noto+Serif+Ethiopic:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background: #eafcf4;
    font-family: "Noto Sans Ethiopic", "Nyala", "Abyssinica SIL", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    position: relative;
    top: 26px;
    width: 100%;
    max-width: 285px;
    background: #ffffff;
    border: 1px solid #d5f5e6;
    border-radius: 24px;
    padding: 24px 24px 24px;
    text-align: center;
    box-shadow: 0 24px 40px -8px rgba(60, 120, 90, 0.28), 0 8px 16px rgba(60, 120, 90, 0.08);
  }

  .icon-circle {
    width: 72px;
    height: 72px;
    margin: 0 auto;
    border-radius: 50%;
    background: #d1fae5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-circle svg { width: 36px; height: 36px; }

  .title {
    margin-top: 22px;
    font-size: 36px;
    font-weight: 800;
    line-height: 1.2;
    color: #047857;
  }

  .plate {
    margin: 10px auto 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 33px;
    padding: 0 16px 0 14px;
    background: #f0f4f9;
    border-radius: 999px;
    font-family: "Noto Serif Ethiopic", "Nyala", serif;
    font-weight: 700;
    font-size: 16px;
    color: #1e293b;
    letter-spacing: 0.3px;
  }
  .plate svg { width: 16px; height: 16px; flex: none; }

  .route {
    margin-top: 24px;
    padding: 14px 16px 0 16px;
    height: 60px;
    background: #f8fafc;
    border: 1px solid #eef1f5;
    border-radius: 18px;
    text-align: left;
  }
  .route-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-weight: 700;
    color: #5f6f86;
  }
  .route-label svg { width: 9px; height: 9px; flex: none; }

  .route-stops {
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #1e293b;
    white-space: nowrap;
  }
  .route-stops .passed { color: #94a3b8; }
  .route-stops .arrow { color: #a5b1c2; font-weight: 400; font-size: 11px; }
</style>
</head>
<body>

  <main class="card">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 11.1V12a9.5 9.5 0 1 1-5.63-8.68"/>
        <path d="M8.5 11.5l3.5 3.5L21 6"/>
      </svg>
    </div>

    <h1 class="title">የተረጋገጠ</h1>

    <div class="plate">
      <svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
        <circle cx="7" cy="17" r="2"/>
        <path d="M9 17h6"/>
        <circle cx="17" cy="17" r="2"/>
      </svg>
      <span>3-A75966 አአ</span>
    </div>

    <section class="route">
      <div class="route-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.1 4.6 9 3 3.5 5A1 1 0 0 0 3 6v14.5L9 18.5l5 2 6-2.5a1 1 0 0 0 .5-.9V3L14.1 4.6z"/>
          <path d="M9 3v15.5M14.5 5v15.5"/>
        </svg>
        <span>የተፈቀደለት መስመር</span>
      </div>
      <div class="route-stops">
        <span>ከላምበረት</span>
        <span class="arrow">→</span>
        <span class="passed">በቦሌ ሳሪስ</span>
        <span class="arrow">→</span>
        <span>ቃሊቲ</span>
      </div>
    </section>
  </main>

</body>
</html>
